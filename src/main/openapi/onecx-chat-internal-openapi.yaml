---
openapi: 3.0.3
info:
  title: onecx-chat internal service
  version: 1.0.0
servers:
  - url: "http://onecx-chat-svc:8080"
tags:
  - name: chatsInternal
  - name: messagesInternal
  - name: toolCallsInternal
paths:
  /internal/chats/{chatId}/messages:
    get:
      security:
        - oauth2: [ ocx-chat:all, ocx-chat:read ]
      tags:
        - chatsInternal
      description: Return list of messages
      operationId: getChatMessages
      parameters:
        - name: chatId
          in: path
          required: true
          description: The ID of the chat
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
    post:
      security:
        - oauth2: [ ocx-chat:all, ocx-chat:write ]
      tags:
        - chatsInternal
      description: creates a Message
      operationId: createChatMessage
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessage'
      responses:
        "201":
          description: New message created
          headers:
            Location:
              required: true
              schema:
                type: string
                format: url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
  /internal/chats/{chatId}/participants:
    get:
      security:
        - oauth2: [ ocx-chat:all, ocx-chat:read ]
      tags:
        - chatsInternal
      description: Return list of participants
      operationId: getChatParticipants
      parameters:
        - name: chatId
          in: path
          required: true
          description: The ID of the chat
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Participant'
    post:
      security:
        - oauth2: [ ocx-chat:all, ocx-chat:write ]
      tags:
        - chatsInternal
      description: add a participant
      operationId: addParticipant
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddParticipant'
      responses:
        "201":
          description: New Participant added
          headers:
            Location:
              required: true
              schema:
                type: string
                format: url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
  /internal/chats:
    get:
      security:
        - oauth2: [ ocx-chat:all, ocx-chat:read ]
      tags:
        - chatsInternal
      description: Return list of chats
      operationId: getChats
      parameters:
        - name: pageNumber
          in: query
          schema:
            format: int32
            description: The number of page.
            default: 0
            type: integer
        - name: pageSize
          in: query
          schema:
            format: int32
            description: The size of page
            default: 10
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatPageResult'
    post:
      security:
        - oauth2: [ ocx-chat:all, ocx-chat:write ]
      tags:
        - chatsInternal
      description: Create chat
      operationId: createChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChat'
      responses:
        "201":
          description: New chat created
          headers:
            Location:
              required: true
              schema:
                type: string
                format: url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
  /internal/chats/{id}:
    get:
      security:
        - oauth2: [ ocx-chat:all, ocx-chat:read ]
      tags:
        - chatsInternal
      description: Return chat by ID
      operationId: getChatById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        "404":
          description: Not found
    put:
      security:
        - oauth2: [ ocx-chat:all, ocx-chat:write ]
      tags:
        - chatsInternal
      description: Update chat by ID
      operationId: updateChat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChat'
      responses:
        "204":
          description: Chat updated
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "404":
          description: Chat not found
    delete:
      security:
        - oauth2: [ ocx-chat:all, ocx-chat:delete ]
      tags:
        - chatsInternal
      description: Delete chat by ID
      operationId: deleteChat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
  /internal/chats/search:
    post:
      security:
        - oauth2: [ ocx-chat:all, ocx-chat:read ]
      tags:
        - chatsInternal
      description: Search for chats
      operationId: searchChats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSearchCriteria'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatPageResult'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "404":
          description: Chat message not found
  /internal/chats/messages/search:
    post:
      security:
        - oauth2: [ ocx-chat:all, ocx-chat:read ]
      tags:
        - chatsInternal
      description: Search for chat messages
      operationId: searchChatMessages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageSearchCriteria'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessageResponse'
  /internal/chats/{chatId}/conversation-entries:
    put:
      security:
        - oauth2: [ ocx-chat:all, ocx-chat:write ]
      tags:
        - chatsInternal
      description: Add new or update conversation entry of the chat by ID and
      operationId: addOrUpdateConversationEntry
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateConversationEntry'
      responses:
        "204":
          description: Conversation entries added or updated
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "404":
          description: Conversation entry not added or updated
    get:
      security:
        - oauth2: [ ocx-chat:all, ocx-chat:read ]
      tags:
        - chatsInternal
      description: Return Response with list of conversation entrieschat by chat ID
      operationId: getConversationEntriesByChatId
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatConversationEntry'
        "404":
          description: Not found
  /internal/chats/{chatId}/tool-calls:
    post:
      security:
        - oauth2: [ ocx-chat:tool-runtime ]
      tags:
        - toolCallsInternal
      description: Register a policy-evaluated tool call without invoking it
      operationId: registerToolCall
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterToolCall'
      responses:
        "201":
          description: Tool call attempt registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCallSafeSummary'
        "400":
          description: Invalid lifecycle transition or incompatible retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "409":
          description: Lifecycle conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "404":
          description: Chat not found
    get:
      security:
        - oauth2: [ ocx-chat:all, ocx-chat:read ]
      tags:
        - toolCallsInternal
      description: Return sanitized tool-call summaries in conversation order
      operationId: getToolCallHistory
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sanitized tool-call history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToolCallSafeSummary'
        "404":
          description: Chat not found
  /internal/chats/{chatId}/tool-calls/{attemptId}/decision:
    post:
      security:
        - oauth2: [ ocx-chat:all, ocx-chat:write ]
      tags:
        - toolCallsInternal
      description: Record the single terminal decision for a proposed tool call
      operationId: decideToolCall
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolCallDecision'
      responses:
        "200":
          description: Decision recorded or identical retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCallSafeSummary'
        "400":
          description: Invalid or conflicting decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "409":
          description: Lifecycle conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "404":
          description: Attempt not found
  /internal/chats/{chatId}/tool-calls/{attemptId}/claims:
    post:
      security:
        - oauth2: [ ocx-chat:tool-runtime ]
      tags:
        - toolCallsInternal
      description: Atomically claim execution for an eligible attempt
      operationId: claimToolCall
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolCallClaim'
      responses:
        "201":
          description: Execution claim granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCallClaimResponse'
        "200":
          description: Idempotent retry; execution is not granted again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCallClaimResponse'
        "400":
          description: Attempt cannot be claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "409":
          description: Another claim is active or this attempt cannot be claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "404":
          description: Attempt not found
  /internal/chats/{chatId}/tool-calls/{attemptId}/outcome:
    post:
      security:
        - oauth2: [ ocx-chat:tool-runtime ]
      tags:
        - toolCallsInternal
      description: Store a sanitized summary and a private model-consumed result
      operationId: reportToolCallOutcome
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolCallOutcome'
      responses:
        "200":
          description: Outcome recorded or identical retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCallSafeSummary'
        "400":
          description: Invalid outcome or claim ownership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "409":
          description: Outcome conflicts with the active claim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "404":
          description: Attempt not found
  /internal/chats/{chatId}/tool-calls/{attemptId}/continuations:
    post:
      security:
        - oauth2: [ ocx-chat:tool-runtime ]
      tags:
        - toolCallsInternal
      description: Append a causal continuation after a recorded result
      operationId: appendToolCallContinuation
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolCallContinuation'
      responses:
        "201":
          description: Continuation appended
        "400":
          description: Invalid continuation or causal reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "409":
          description: Continuation conflicts with lifecycle state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "404":
          description: Attempt not found
  /internal/chats/{chatId}/tool-calls/runtime-replay:
    get:
      security:
        - oauth2: [ ocx-chat:tool-runtime ]
      tags:
        - toolCallsInternal
      description: Return protected runtime replay including private tool inputs and results
      operationId: getToolCallRuntimeReplay
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Runtime-only replay in conversation sequence order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToolCallRuntimeReplay'
        "404":
          description: Chat not found
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://oauth.simple.api/token
          scopes:
            ocx-chat:all: Grants access to all operations
            ocx-chat:read: Grants read access
            ocx-chat:write: Grants write access
            ocx-chat:delete: Grants access to delete operations
            ocx-chat:tool-runtime: Grants access to report tool calls and retrieve private runtime replay

  schemas:
    ChatType:
      type: string
      enum:
        - HUMAN_DIRECT_CHAT
        - HUMAN_GROUP_CHAT
        - AI_CHAT
    MessageType:
      type: string
      enum:
        - HUMAN
        - ASSISTANT
        - SYSTEM
    ParticipantType:
      type: string
      enum:
        - HUMAN
        - ASSISTANT
    ChatSearchCriteria:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ChatType'
        topic:
          type: string
        participant:
          type: string
        appId:
          type: string
        pageNumber:
          format: int32
          description: The number of page.
          default: 0
          type: integer
        pageSize:
          format: int32
          description: The size of page
          default: 10
          type: integer
    ChatMessageSearchCriteria:
      required:
        - chatId
      type: object
      properties:
        chatId:
          type: string
        pageNumber:
          format: int32
          description: The number of page.
          default: 0
          type: integer
        pageSize:
          format: int32
          description: The size of page
          default: 20
          maximum: 50
          type: integer
    ChatPageResult:
      type: object
      properties:
        totalElements:
          format: int64
          description: The total elements in the resource.
          type: integer
        number:
          format: int32
          type: integer
        size:
          format: int32
          type: integer
        totalPages:
          format: int64
          type: integer
        stream:
          type: array
          items:
            $ref: '#/components/schemas/Chat'
    MessagePageResult:
      type: object
      properties:
        totalElements:
          format: int64
          description: The total elements in the resource.
          type: integer
        number:
          format: int32
          type: integer
        size:
          format: int32
          type: integer
        totalPages:
          format: int64
          type: integer
        stream:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    ChatMessageResponse:
      type: object
      properties:
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        messages:
          $ref: '#/components/schemas/MessagePageResult'
    Chat:
      required:
        - type
      type: object
      properties:
        version:
          format: int32
          type: integer
        creationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        creationUser:
          type: string
        modificationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        modificationUser:
          type: string
        id:
          type: string
        type:
          $ref: '#/components/schemas/ChatType'
        topic:
          type: string
        summary:
          type: string
        appId:
          type: string
        userId:
          type: string
        lastMessageDate:
          $ref: '#/components/schemas/OffsetDateTime'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
    Message:
      required:
        - type
      type: object
      properties:
        version:
          format: int32
          type: integer
        creationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        creationUser:
          type: string
        modificationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        modificationUser:
          type: string
        id:
          type: string
        type:
          $ref: '#/components/schemas/MessageType'
        text:
          type: string
        userId:
          type: string
    Participant:
      required:
        - type
        - userId
      type: object
      properties:
        version:
          format: int32
          type: integer
        creationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        creationUser:
          type: string
        modificationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        modificationUser:
          type: string
        id:
          type: string
        type:
          $ref: '#/components/schemas/ParticipantType'
        userId:
          type: string
        userName:
          type: string
        email:
          type: string
    OffsetDateTime:
      format: date-time
      type: string
      example: 2022-03-10T12:15:50-04:00
    ProblemDetailResponse:
      type: object
      properties:
        errorCode:
          type: string
        detail:
          type: string
        params:
          type: array
          items:
            $ref: '#/components/schemas/ProblemDetailParam'
        invalidParams:
          type: array
          items:
            $ref: '#/components/schemas/ProblemDetailInvalidParam'
    ProblemDetailParam:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    ProblemDetailInvalidParam:
      type: object
      properties:
        name:
          type: string
        message:
          type: string
    CreateMessage:
      required:
        - type
      type: object
      properties:
        version:
          format: int32
          type: integer
        creationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        creationUser:
          type: string
        modificationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        modificationUser:
          type: string
        id:
          type: string
        text:
          type: string
        type:
          $ref: '#/components/schemas/MessageType'
        userId:
          type: string
        requestContext:
          $ref: '#/components/schemas/RequestContext'
        skipAIProcessing:
          type: boolean
        awaitResponse:
          type: boolean
          default: true
    RequestContext:
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/ConfigurationFilter'
        agentId:
          type: string
        aiContext:
          type: array
          items:
            type: string
    ConfigurationFilter:
      type: object
      properties:
        key:
          type: string
          enum:
            - APP_ID
        value:
          type: string
    AddParticipant:
      required:
        - type
        - userId
      type: object
      properties:
        version:
          format: int32
          type: integer
        creationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        creationUser:
          type: string
        modificationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        modificationUser:
          type: string
        id:
          type: string
        type:
          $ref: '#/components/schemas/ParticipantType'
        userId:
          type: string
        userName:
          type: string
        email:
          type: string
    CreateChat:
      required:
        - type
        - participants
      type: object
      properties:
        version:
          format: int32
          type: integer
        creationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        creationUser:
          type: string
        modificationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        modificationUser:
          type: string
        id:
          type: string
        userId:
          type: string
          description: userId of the chat creator
        type:
          $ref: '#/components/schemas/ChatType'
        topic:
          type: string
        summary:
          type: string
        appId:
          type: string
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
    UpdateChat:
      required:
        - name
      type: object
      properties:
        version:
          format: int32
          type: integer
        creationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        creationUser:
          type: string
        modificationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        modificationUser:
          type: string
        id:
          type: string
        type:
          $ref: '#/components/schemas/ChatType'
        topic:
          type: string
        summary:
          type: string
        appId:
          type: string
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'           
    CreateOrUpdateConversationEntry:
      required:
        - idempotencyKey
        - type
      type: object
      properties:
        idempotencyKey:
          type: string
          description: Unique key to identify the conversation entry for idempotency
        type:
          $ref: '#/components/schemas/ConversationType'
        agentConfigVersion:
          type: string
          maxLength: 255
        chat:
          $ref: '#/components/schemas/Chat'
        status:
          $ref: '#/components/schemas/EntryStatus'
        text:
          type: string
    EntryStatus:
      type: string
      enum:
        - IN_PROGRESS
        - COMPLETED
        - INTERRUPTED
    ChatConversationEntryResponse:
      type: object
      properties:
        chat:
          $ref: '#/components/schemas/Chat'
        idempotencyKey:
          type: string
        sequenceNumber:
          type: integer
        agentConfigVersion:
          type: string
    ChatConversationEntry:
      type: object
      properties:
        chat:
          $ref: '#/components/schemas/Chat'
        sequenceNumber:
          type: integer
        idempotencyKey:
          type: string
          description: Unique key to identify the conversation entry for idempotency
        text:
          type: string
        type:
          $ref: '#/components/schemas/ConversationType'
        agentConfigVersion:
          type: string
        causalReference:
          type: string
